version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aseno_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aseno_clinic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aseno_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ for message queuing (reminder workers)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: aseno_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: aseno
      RABBITMQ_DEFAULT_PASS: aseno_password
      RABBITMQ_DEFAULT_VHOST: aseno
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Evolution API for WhatsApp integration (optional for development)
  # Uncomment when ready to test WhatsApp integration
  # evolution:
  #   image: atendai/evolution-api:v2.1.1
  #   container_name: aseno_evolution
  #   restart: unless-stopped
  #   ports:
  #     - "8081:8080"
  #   environment:
  #     - SERVER_URL=http://localhost:8081
  #     - AUTHENTICATION_API_KEY=your-evolution-api-key
  #     - DATABASE_ENABLED=true
  #     - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@postgres:5432/evolution
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - evolution_instances:/evolution/instances

  # pgAdmin - Database Management UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aseno_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5555:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  pgadmin_data:
  # evolution_instances: